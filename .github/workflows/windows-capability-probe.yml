name: Windows capability probe

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label'
        required: false
        default: 'windows-latest'

permissions: {}

jobs:
  live-e2e:
    name: Run the Windows live E2E suite once on a hosted runner
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup show

      - name: Describe the runner
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber | Format-List
          Get-AppxPackage -Name '*Notepad*','*Calculator*','*WindowsTerminal*','*Paint*' -ErrorAction SilentlyContinue | Select-Object Name, Version | Format-Table
          Get-Command notepad.exe, msedge.exe, chrome.exe -ErrorAction SilentlyContinue | Select-Object Name, Source | Format-Table
          Get-ChildItem "$env:ProgramFiles\WindowsApps" -ErrorAction SilentlyContinue | Select-Object -First 40 Name | Format-Table

      - name: Run scripts/run-windows-e2e-ci.ps1
        shell: powershell
        env:
          AGENT_DESKTOP_NATIVE_E2E_RUNNER: '1'
        run: |
          $start = Get-Date
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\run-windows-e2e-ci.ps1
          $code = $LASTEXITCODE
          Write-Host ("E2E exit code {0} after {1:n1} min" -f $code, ((Get-Date) - $start).TotalMinutes)
          exit $code
