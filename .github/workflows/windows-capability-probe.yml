name: Windows capability probe

on:
  workflow_dispatch:
    inputs:
      filters:
        description: 'Space-separated lib test name filters for agent-desktop-windows'
        required: true
      break:
        description: 'PowerShell that breaks the fix before the second run; empty skips it'
        required: false
        default: ''
      runner:
        description: 'Runner label'
        required: false
        default: 'windows-latest'

permissions: {}

jobs:
  probe:
    name: Run named Windows lib tests, fixed then broken
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup show

      - name: Isolate HOME
        shell: pwsh
        run: |
          $cargoHome  = if ($env:CARGO_HOME)  { $env:CARGO_HOME }  else { Join-Path $env:USERPROFILE '.cargo' }
          $rustupHome = if ($env:RUSTUP_HOME) { $env:RUSTUP_HOME } else { Join-Path $env:USERPROFILE '.rustup' }
          $testHome = Join-Path $env:RUNNER_TEMP ("agent-desktop-test-home-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $testHome | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "CARGO_HOME=$cargoHome"
          Add-Content -Path $env:GITHUB_ENV -Value "RUSTUP_HOME=$rustupHome"
          Add-Content -Path $env:GITHUB_ENV -Value "HOME=$testHome"
          Add-Content -Path $env:GITHUB_ENV -Value "USERPROFILE=$testHome"

      - name: Restore main's build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/
          key: ${{ runner.os }}-build-ci-none
          restore-keys: |
            ${{ runner.os }}-build-ci-

      - name: Run the named tests with the fix
        shell: pwsh
        env:
          FILTERS: ${{ inputs.filters }}
        run: |
          $filters = @($env:FILTERS -split ' ' | Where-Object { $_ })
          cargo test --locked -p agent-desktop-windows --lib -- @filters --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Break the fix and run the named tests again
        if: ${{ inputs.break != '' }}
        shell: pwsh
        env:
          FILTERS: ${{ inputs.filters }}
          BREAK: ${{ inputs.break }}
        run: |
          & ([scriptblock]::Create($env:BREAK))
          git diff --stat
          $filters = @($env:FILTERS -split ' ' | Where-Object { $_ })
          cargo test --locked -p agent-desktop-windows --lib -- @filters --nocapture --test-threads=1
          if ($LASTEXITCODE -eq 0) { Write-Host 'INVERT: the broken build PASSED, the tests do not guard the fix'; exit 1 }
          Write-Host 'INVERT: the broken build FAILED as expected'
          exit 0
