name: Windows capability probe

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label'
        required: false
        default: 'windows-latest'

permissions: {}

jobs:
  live-e2e:
    name: Run the Windows live E2E suite once on a hosted runner
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup show

      - name: Describe the runner
        continue-on-error: true
        shell: powershell
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber | Format-List
          try { Get-AppxPackage -Name '*Notepad*' | Select-Object Name, Version | Format-Table } catch { Write-Host "appx notepad: $_" }
          try { Get-AppxPackage -Name '*Calculator*' | Select-Object Name, Version | Format-Table } catch { Write-Host "appx calc: $_" }
          try { (Get-Item "$env:WINDIR\System32\notepad.exe").VersionInfo | Format-List FileVersion, ProductName } catch { Write-Host "notepad: $_" }
          Get-Command msedge.exe, chrome.exe -ErrorAction SilentlyContinue | Select-Object Name, Source | Format-Table

      - name: Run scripts/run-windows-e2e-ci.ps1
        shell: powershell
        env:
          AGENT_DESKTOP_NATIVE_E2E_RUNNER: '1'
        run: |
          $start = Get-Date
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\run-windows-e2e-ci.ps1
          $code = $LASTEXITCODE
          Write-Host ("E2E exit code {0} after {1:n1} min" -f $code, ((Get-Date) - $start).TotalMinutes)
          exit $code
